apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolioassistant
  namespace: stock-trader
  labels:
    app: portfolioassistant-stock-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolioassistant
  template:
    metadata:
      labels:
        app: portfolioassistant
      annotations:
        git-repo: "https://github.com/IBMStockTrader/PortfolioAssistant"
    spec:
      containers:
      - name: portfolioassistant
        image: portfolioassistantacr.azurecr.io/ibmstocktrader/portfolioassistant:latest
        ports:
          - containerPort: 8080
          - containerPort: 8443
        imagePullPolicy: Always
        env:
        - name: AZURE_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: azure-openai-secret
              key: AZURE_OPENAI_API_KEY
        - name: AZURE_OPENAI_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: azure-openai-secret
              key: AZURE_OPENAI_ENDPOINT
        # Full MCP Client Configuration
        - name: PORTFOLIO_MCP_HOST
          value: "mcp-portfolio-server-service.stock-trader.svc.cluster.local"
        - name: STOCKQUOTE_MCP_HOST
          value: "mcp-stockquote-server-service.stock-trader.svc.cluster.local"
        - name: TRADEHISTORY_MCP_HOST
          value: "mcp-tradehistory-server-service.stock-trader.svc.cluster.local"
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 256Mi
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 32Mi
      imagePullSecrets:
        - name: acr-auth
---
apiVersion: v1
kind: Service
metadata:
  name: portfolioassistant-service
  namespace: stock-trader
  labels:
    app: portfolioassistant
spec:
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 8080
      targetPort: 8080
    - name: https
      protocol: TCP
      port: 8443
      targetPort: 8443
  selector:
    app: portfolioassistant
---
# MCP Portfolio Server
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-portfolio-server
  namespace: stock-trader
  labels:
    app: mcp-portfolio-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mcp-portfolio-server
  template:
    metadata:
      labels:
        app: mcp-portfolio-server
    spec:
      containers:
      - name: mcp-portfolio-server
        image: portfolioassistantacr.azurecr.io/stocktrader/mcp-portfolio-server:latest
        ports:
          - containerPort: 8000
          - containerPort: 9000
        imagePullPolicy: Always
        env:
        - name: PORTFOLIO_API_URL
          value: "http://gitops-stocktrader-portfolio-service.stock-trader.svc.cluster.local:9080"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
            ephemeral-storage: 64Mi
          requests:
            cpu: 200m
            memory: 256Mi
            ephemeral-storage: 16Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
      imagePullSecrets:
        - name: acr-auth
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-portfolio-server-service
  namespace: stock-trader
  labels:
    app: mcp-portfolio-server
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 8000
      targetPort: 8000
    - name: mcp-protocol
      protocol: TCP
      port: 9000
      targetPort: 9000
  selector:
    app: mcp-portfolio-server
---
