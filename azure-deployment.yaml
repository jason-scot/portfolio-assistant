apiVersion: apps/v1
kind: Deployment
metadata:
  name: portfolioassistant
  namespace: stock-trader
  labels:
    app: portfolioassistant-stock-trader
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portfolioassistant
  template:
    metadata:
      labels:
        app: portfolioassistant
      annotations:
        git-repo: "https://github.com/IBMStockTrader/PortfolioAssistant"
    spec:
      containers:
      - name: portfolioassistant
        image: portfolioassistantacr.azurecr.io/ibmstocktrader/portfolioassistant:latest
        ports:
          - containerPort: 9080
          - containerPort: 9443
        imagePullPolicy: Always
        resources:
          limits:
            cpu: 1000m
            memory: 2Gi
            ephemeral-storage: 256Mi
          requests:
            cpu: 500m
            memory: 1Gi
            ephemeral-storage: 32Mi
      imagePullSecrets:
        - name: acr-auth
---
apiVersion: v1
kind: Service
metadata:
  name: portfolioassistant-service
  namespace: stock-trader
  labels:
    app: portfolioassistant
spec:
  type: NodePort
  ports:
    - name: http
      protocol: TCP
      port: 9080
      targetPort: 9080
    - name: https
      protocol: TCP
      port: 9443
      targetPort: 9443
  selector:
    app: portfolioassistant
