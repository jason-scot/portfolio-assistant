#########################
# Quarkus Configuration #
#########################
# Dump config info, useful for debugging
quarkus.config-tracking.enabled=true
# Configure http port:
quarkus.http.port=8080

#########################
# Quarkus Management Configuration #
#########################
# Use basic auth
# TODO fix these
quarkus.management.auth.enabled=true
# Configure auth
quarkus.management.auth.permission.metrics.policy=permit


##############################
# Quarkus Role Configuration #
##############################
# This recreates what we had in OpenLiberty where all authenticated users have access to everything
# TODO: need to handle StockViewer, too
quarkus.http.auth.policy.stocktrader.roles-allowed=StockTrader
quarkus.http.auth.permission.permit1.paths=/*
quarkus.http.auth.permission.permit1.policy=authenticated
quarkus.http.auth.policy.stockviewer.roles-allowed=StockViewer
quarkus.http.auth.permission.permit2.paths=/*
quarkus.http.auth.permission.permit2.policy=authenticated
org.eclipse.microprofile.rest.client.propagateHeaders=Authorization,Proxy-Authorization

# (Debug only) Trace settings for debugs
quarkus.langchain4j.log-requests=true
quarkus.langchain4j.log-responses=true

##############
# JWT Config #
##############
# Common Config
# prod configuration
mp.jwt.verify.publickey.location=classpath:META-INF/resources/keys/trust.p12
smallrye.jwt.keystore.verify.key.alias=jwtSigner
smallrye.jwt.keystore.type=PKCS12
smallrye.jwt.keystore.password=St0ckTr@der


# ? Claims checks
mp.jwt.verify.issuer=${JWT_ISSUER:http://stock-trader.ibm.com}
mp.jwt.verify.audiences=${JWT_AUDIENCE:stock-trader}

# Unused since we don't have a nested encrypted key (we're not using JWE)
#smallrye.jwt.keystore.decrypt.key.password=St0ckTr@der
#smallrye.jwt.keystore.decrypt.key.alias=jwtSigner
#mp.jwt.decrypt.key.location=classpath:META-INF/resources/keys/key.p12


# TODO fix the item below for native builds to work
#quarkus.native.resources.includes=./key.pem

############
## MP Rest Client Configuration
############
quarkus.rest-client.logging.scope=request-response
quarkus.rest-client.logging.body-limit=1024
quarkus.rest-client.extensions-api.scope=all

############
# Portfolio Service Properties
############
quarkus.rest-client.portfolio-api.url=http://gitops-stocktrader-portfolio-service.stock-trader.svc.cluster.local:9080/portfolio
quarkus.rest-client.portfolio-api.scope=all

############
# Stock Quote Service Properties
############
quarkus.rest-client.stock-api.url=http://gitops-stocktrader-stock-quote-service.stock-trader.svc.cluster.local:9080/stock-quote
quarkus.rest-client.stock-api.scope=all

############
# Trade History Service Properties
############
# Trade History service not currently deployed - commenting out for now
# quarkus.rest-client.tradehistory-api.url=http://gitops-stocktrader-trade-history-service.stock-trader.svc.cluster.local:9080/trade-history
# quarkus.rest-client.tradehistory-api.scope=all

############
# AI Properties
############
# Azure OpenAI Configuration
quarkus.langchain4j.azure-openai.api-key=${AZURE_OPENAI_API_KEY}
quarkus.langchain4j.azure-openai.endpoint=${AZURE_OPENAI_ENDPOINT}
quarkus.langchain4j.azure-openai.resource-name=portfolio-assistant-openai
quarkus.langchain4j.azure-openai.deployment-name=gpt-4
quarkus.langchain4j.azure-openai.chat-model.temperature=0.4
quarkus.langchain4j.azure-openai.timeout=60s
# Rate limit handling
quarkus.langchain4j.azure-openai.max-retries=3
quarkus.langchain4j.azure-openai.log-requests=true
quarkus.langchain4j.azure-openai.log-responses=true


######################################
# OpenAPI Configuration
######################################
quarkus.smallrye-openapi.store-schema-directory=src/main/generated/openapi

############
# MCP Server Configuration (Full Protocol)
############
# Full MCP Protocol Client Configuration (for dynamic discovery)
mcp.fullclient.portfolio.host=${PORTFOLIO_MCP_HOST:mcp-portfolio-server-service.stock-trader.svc.cluster.local}
mcp.fullclient.stockquote.host=${STOCKQUOTE_MCP_HOST:mcp-stockquote-server-service.stock-trader.svc.cluster.local}
mcp.fullclient.tradehistory.host=${TRADEHISTORY_MCP_HOST:mcp-tradehistory-server-service.stock-trader.svc.cluster.local}

############
# DEBUG
############
quarkus.jib.jvm-additional-arguments=-agentlib:jdwp=transport=dt_socket\\,server=y\\,suspend=n\\,address=*:5005
quarkus.log.category."org.jboss.resteasy.reactive.client.logging".level=DEBUG
quarkus.log.console.level=DEBUG
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."io.quarkus.langchain4j".level=DEBUG
